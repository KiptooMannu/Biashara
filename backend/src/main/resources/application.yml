spring:
  application:
    name: biashara-erp

  # Supabase PostgreSQL by default; override with SPRING_PROFILES_ACTIVE=neon or h2
  # to run against Neon or use local file-backed database.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:supabase}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
        # Grouping inserts by table before flushing is what lets the JDBC driver
        # actually batch them, rather than interleaving tables and breaking runs.
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  # Render (and most PaaS hosts) inject the port to bind on as $PORT and route
  # public traffic to it. Falls back to 8080 for local runs.
  port: ${PORT:8080}
  error:
    include-message: always
  # The platform sits behind a proxy that terminates TLS; without this the app
  # builds redirect and cookie URLs against http:// and the wrong host.
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Health only. The rest of actuator is not authenticated here and has no
        # business being reachable.
        include: health
  endpoint:
    health:
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

biashara:
  jwt:
    secret: ${BIASHARA_JWT_SECRET:b1a5h4r4-d3m0-s3cr3t-k3y-must-be-at-least-64-bytes-long-for-hs512-signing!!}
    access-token-minutes: 120
    refresh-token-days: 7
  security:
    max-failed-logins: 5
    lockout-minutes: 15
  seed:
    # Set to false once a deployed environment has been seeded, so a restart is
    # not spent re-walking 27 tables to conclude they are already populated.
    enabled: ${BIASHARA_SEED_ENABLED:false}
  cors:
    # Comma-separated origin patterns. The deployed frontend lives on a
    # different host to the API, so this has to be set at deploy time —
    # e.g. BIASHARA_CORS_ORIGINS=https://biashara.vercel.app
    allowed-origins: ${BIASHARA_CORS_ORIGINS:https://biashara-eight.vercel.app,https://*.vercel.app,http://localhost:*,http://127.0.0.1:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.biashara: INFO
    org.hibernate.SQL: WARN
